name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[docs]"
      - name: Build docs
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site
  deploy-docs:
    # Enable Pages (Settings → Pages → Source: GitHub Actions) and set the repo variable PAGES_ENABLED=true.
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    continue-on-error: true
    steps:
      - uses: actions/deploy-pages@v4
